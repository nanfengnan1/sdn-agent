{
  "agent": {
    "dataplane": "vpp",
    "listen": ":9090",
    "insecure": true,
    "frr": true,
    "stateDir": "/var/lib/sdn-agent"
  },
  "vpp": {
    "startupConfig": "/etc/vpp/startup.conf",
    "apiSocket": "/run/vpp/api.sock",
    "adapterSocket": "/run/sdn-agent/vpp.sock",
    "startupTimeoutSeconds": 60
  },
  "redis": { "enabled": true }
}
